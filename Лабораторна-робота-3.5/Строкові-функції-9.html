<?php
$text = mb_strtolower(file_get_contents("text.txt"));
$letters = preg_replace('/[^а-яіїєґa-z]/u', '', $text);
$freq = [];
foreach (preg_split('//u', $letters, -1, PREG_SPLIT_NO_EMPTY) as $char) {
    if (!isset($freq[$char])) {
        $freq[$char] = 0;
    }
    $freq[$char]++;
}
arsort($freq);
$key = array_key_first($freq);
echo "Найчастіше зустрічається буква: $key";
echo "<br>Кількість: " . $freq[$key];
?>
