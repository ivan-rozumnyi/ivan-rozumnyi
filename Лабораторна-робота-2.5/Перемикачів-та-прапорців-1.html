<p>Площа фігур</p>

<script>
function test(k) {
    var a = document.form1.data.value;
    if (a !== "" && !isNaN(a)) {
        document.form1.res.value = k * Math.pow(a, 2);
    } else {
        alert("Введіть значення!");
    }
}
</script>
</head>

<body>
<form name="form1">
<h3>Обчислення площі фігур</h3>

Введіть значення:
<input type="text" name="data"><br><br>

Оберіть фігуру:<br>
<input type="radio" name="fv" onclick="test(1)"> Квадрат<br>
<input type="radio" name="fv" onclick="test(3.14)"> Коло<br>
<input type="radio" name="fv" onclick="test(0.42)"> Трикутник<br><br>

Площа:
<input type="text" name="res">
</form>

</p>

</body>
</html>
