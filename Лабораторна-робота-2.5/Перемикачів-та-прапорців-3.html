<!doctype html>

<html>
<head>
    <meta charset="utf-8">
    <title>Перемикачів та прапорців No3</title>
</head>
<body bgcolor="#EEEEEE" text="black" link="blue">

<h1 align="center">Перемикачів та прапорців No3</h1>
<hr>

<!-- главная картинка -->
<p align="center">
    <img src="/ivan-rozumnyi/картинки-для-сайта/картинка1.png" width="200">
</p>

<p>Анкета курсанта</p>

<script>
function showForm() {
    let gender = document.querySelector('input[name="gender"]:checked');
    let dept = document.querySelector('input[name="dept"]:checked');
    let hobbies = [];
    if (document.form1.h1.checked) hobbies.push("Спорт");
    if (document.form1.h2.checked) hobbies.push("Навчання");
    if (document.form1.h3.checked) hobbies.push("Музика");
    let text =
        "Анкета курсанта:\n\n" +
        "Стать: " + (gender ? gender.value : "не вибрано") + "\n" +
        "Вік: " + document.form1.age.value + "\n" +
        "Курс: " + document.form1.course.value + "\n" +
        "Відділення: " + (dept ? dept.value : "не вибрано") + "\n" +
        "Місце проживання: " + document.form1.city.value + "\n" +
        "Інтереси: " + hobbies.join(", ");
    alert(text);
}
</script>
</head>

<body>
<h3>Анкета курсанта</h3>
<form name="form1">

Стать:<br>
<input type="radio" name="gender" value="Чоловік"> Чоловік
<input type="radio" name="gender" value="Жінка"> Жінка
<br><br>

Вік:
<input type="text" name="age"><br><br>

Курс:
<input type="text" name="course"><br><br>

Відділення:<br>
<input type="radio" name="dept" value="IT"> IT
<input type="radio" name="dept" value="Економіка"> Економіка
<br><br>

Місце проживання:
<input type="text" name="city"><br><br>

Інтереси:<br>
<input type="checkbox" name="h1"> Спорт<br>
<input type="checkbox" name="h2"> Навчання<br>
<input type="checkbox" name="h3"> Музика<br><br>

<input type="button" value="Показати анкету"
onclick="showForm()">
</form>

<br>
<p align="center">
    <a href="Перший-сценарій-сторінка">Повернутися на перемикачів та прапорців сторінку</a>
</p>

<p align="center">
    <em>Ця сторінка для лабораторної роботи 2.5</em>
</p>

</body>
</html>
